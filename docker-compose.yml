services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: diag1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diag1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "9543:5432"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/diag1
    volumes:
      - ./backend:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:9000
    depends_on:
      - backend
    ports:
      - "9080:8080"

volumes:
  db_data:
